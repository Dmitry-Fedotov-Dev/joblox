{{define "content"}}
<section class="quick">
  <form method="post" action="{{p}}/order" data-auto>
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <input type="hidden" name="stamp" value="{{.Stamp}}">
    <input type="hidden" name="quick" value="1">
    <input type="hidden" name="item_{{.Item}}" value="1">
    <p class="quick-live" role="status"><span class="pulse"></span>Оформляем заказ…</p>
    <h1>{{.Title}}</h1>
    <noscript><button class="cta" type="submit">Продолжить</button></noscript>
  </form>
</section>
{{end}}
