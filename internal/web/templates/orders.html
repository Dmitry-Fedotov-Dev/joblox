{{define "content"}}
<div class="a-title"><h1>Заказы</h1></div>
<nav class="tabs">
  <a href="{{p}}/admin/orders?status=active" class="{{if eq .Filter "active"}}on{{end}}">В работе</a>
  {{range .Tabs}}<a href="{{p}}/admin/orders?status={{.ID}}" class="{{if eq $.Filter .ID}}on{{end}}">{{.Title}}<small>{{.Count}}</small></a>{{end}}
  <a href="{{p}}/admin/orders?status=all" class="{{if eq .Filter "all"}}on{{end}}">Все</a>
</nav>
<div class="a-card">
  {{if .Rows}}
  <table class="a-table resp orders">
    <thead><tr><th>№</th><th class="c-hide">Когда</th><th class="c-hide">Покупатель</th><th>Сумма</th><th>Статус</th></tr></thead>
    <tbody>{{range .Rows}}{{template "orow" .}}{{end}}</tbody>
  </table>
  {{else}}<p class="muted">Здесь пока пусто.</p>{{end}}
</div>
{{end}}
{{define "kitten"}}{{end}}
