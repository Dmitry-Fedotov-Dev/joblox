{{template "top" "Joblox: всё рядом"}}
<form class="search" method="get" action="/" role="search">
  <label class="sr" for="q">Что нужно?</label>
  <input id="q" name="q" value="{{.Query}}" placeholder="Что нужно?" autocomplete="off" enterkeyhint="search">
  <button type="submit" aria-label="Найти">→</button>
</form>

<div class="cubes">
  {{range $i, $c := .Tiles}}
  <a class="cube k-{{.Kind}}{{if or .Wide .Trusted}} wide{{end}}" style="--i: {{$i}}" href="{{.URL}}" title="{{.About}}" rel="{{if .Badge}}noopener{{else}}nofollow noopener ugc{{end}}">
    <span class="emoji" aria-hidden="true">{{kindIcon .Kind}}</span>
    {{if .Badge}}<span class="tag">{{.Badge}}</span>{{else if .Trusted}}<span class="tag live"><span class="dot"></span>проверен · на связи</span>{{else}}<span class="tag live"><span class="dot"></span>на связи</span>{{end}}
    <b>{{.Title}}</b>
  </a>
  {{else}}
  <p class="empty">Ничего не нашлось. <a href="/">Показать всё</a></p>
  {{end}}
  <a class="cube k-start" style="--i: 9" href="/start">
    <span class="emoji" aria-hidden="true">✨</span>
    <span class="tag">Бесплатно</span>
    <b>Стать исполнителем</b>
  </a>
</div>
{{template "foot" .}}
