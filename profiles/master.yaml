# Мастер на выезд: сборка мебели, мелкий ремонт, ручная работа. Клиент выбирает, что сделать, и описывает
# задачу, мастер называет цену, клиент подтверждает, мастер приезжает. Оплата после работы, на месте или
# переводом. Цена по запросу, потому что зависит от объёма и материалов.
business:
  name: Мастер Хитаги-сан
  kind: master
  description: Сборка мебели, мелкий ремонт, полки и карнизы, сантехника по мелочи. Выезд в день заявки.
  currency: KGS
  timezone: Asia/Bishkek
  contact: "+996 700 000 000"
  cover: master-cover.webp
  og_image: master-og.jpg

pricing:
  mode: quote
  min_total: 500

checkout:
  fields:
    - {id: work, label: Услуга, type: text, required: true, max_len: 120}
    - {id: name, label: Как к вам обращаться, type: text, required: true, max_len: 80}
    - {id: phone, label: Телефон, type: phone, required: true, hint: Мастер позвонит и договорится о времени и цене}
    - {id: comment, label: Комментарий, type: textarea, max_len: 800, hint: "Необязательно: что сделать, адрес, удобное время"}

payment:
  methods: [transfer]
  require_email_code: false
  reference_prefix: MA
  window_hours: 48
  # аванс до начала работы, остаток после; мастер меняет долю в кабинете: 0, 50 или 100
  prepay_percent: 50

# Схема Agent Pay: заявка, мастер называет цену, клиент вносит аванс по реквизитам и жмёт «Я оплатил»,
# мастер отмечает «Аванс получен» и записывает клиента; после работы остаток и «Оплата получена».
workflow:
  initial: request
  states:
    - {id: request, title: Заявка, customer: "Заявка получена, мастер посмотрит и назовёт цену"}
    - {id: quoted, title: Цена названа, customer: "Мастер назвал цену. Аванс, если он нужен, переведите по реквизитам ниже"}
    - {id: booked, title: Записан, customer: "Мастер записал вас и приедет в согласованное время"}
    - {id: working, title: В работе, customer: "Мастер на месте и работает"}
    - {id: done, title: Готово, customer: "Работа выполнена и оплачена. Спасибо!", final: true}
    - {id: cancelled, title: Отменён, customer: "Заказ отменён. Если вы вносили аванс, мастер вернёт его тем же способом", final: true}
    - {id: expired, title: Истёк, customer: "Заявка закрыта: аванс не поступил вовремя", final: true}
  transitions:
    - {id: quote, title: Цена названа, from: request, to: quoted, by: operator, requires: [priced, approved], notify: true}
    - {id: book, title: Записать, from: quoted, to: booked, by: operator, requires: [prepaid], notify: true}
    - {id: arrive, title: Приехал, from: booked, to: working, by: operator, notify: true}
    - {id: finish, title: Готово, from: working, to: done, by: operator, requires: [paid], notify: true}
    - {id: withdraw, title: Отменить заявку, from: [request, quoted], to: cancelled, by: customer}
    - {id: cancel, title: Отменить, from: [request, quoted, booked, working], to: cancelled, by: operator, notify: true}
    - {id: expire, title: Истёк срок оплаты, from: quoted, to: expired, by: system}

# Услуги — карточки, которые мастер ведёт в кабинете (/owner/catalog): цена «от», описание, фото выполненных
# работ, своя страница у каждой. Список ниже только заполняет пустой каталог при первом запуске; карточка
# открывает заявку, где поле work уже заполнено названием услуги.
service_catalog:
  field: work

services:
  - title: Сборка мебели
    about: "Шкафы, кровати, кухни любых фабрик"
    price: от 800 сом
    icon: "🪑"
  - title: Полки и карнизы
    about: "Повешу ровно, на любую стену"
    price: от 400 сом
    icon: "🖼️"
  - title: Мелкий ремонт
    about: "Двери, ручки, замки, плинтус"
    price: от 500 сом
    icon: "🔨"
  - title: Сантехника
    about: "Смесители, сифоны, подтёки"
    price: от 600 сом
    icon: "🚰"
  - title: Электрика по мелочи
    about: "Розетки, выключатели, люстры"
    price: от 500 сом
    icon: "💡"
  - title: Другое
    about: "Опишите задачу, назову цену"
    price: по договорённости
    icon: "🧰"

antifraud:
  max_orders_per_ip_hour: 3
  review_above: 30000

texts:
  intro: Опишите задачу, мастер назовёт цену. Аванс переводом по реквизитам из заказа, остаток после работы.
