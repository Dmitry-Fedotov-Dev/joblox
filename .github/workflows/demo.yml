# Живые примеры шаблонов: после зелёного CI на main те же исходники выкладываются через cd
# (github.com/Dmitry-Fedotov-Dev/cd): магазин Вали, мастер Хитаги-сан, заказ тарифов и сам сайт Joblox (хаб,
# JOBLOX_COMMAND=hub). Профили сайтов лежат здесь, в profiles/ (JOBLOX_PROFILE=/profiles/…), а реквизиты и
# прочие настройки владелец меняет в админке: на сервере правится только env-файл проекта.
name: Demo

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token is the only credential

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1 # cd builds one project at a time
      matrix:
        # the demos and the shops that run this code as is, their settings and profile kept on the server
        project: [uslozhnyaesh, hitagi, openline-order]
    concurrency:
      group: demo-${{ matrix.project }}
      cancel-in-progress: false
    steps:
      # the head of main: cd archives the commit the run stands on (GITHUB_SHA); a newer push simply wins
      - uses: actions/checkout@v7
      # the bundle cd builds: the sources plus a VERSION file with the commit, as cd passes no build arguments
      - run: |
          git rev-parse --short HEAD > VERSION
          git archive --format=tar --prefix=app/ -o bundle.tar HEAD cmd internal profiles go.mod go.sum Dockerfile .dockerignore
          tar --transform 's,^,app/,' -rf bundle.tar VERSION
          gzip -9 bundle.tar
      - uses: Dmitry-Fedotov-Dev/cd@v1
        with:
          server: ${{ vars.CD_SERVER }}
          project: ${{ matrix.project }}
          bundle: bundle.tar.gz
