# promtool test rules monitoring/prometheus/tests/openline_test.yml (from monitoring/prometheus)
rule_files:
  - ../rules/openline.yml

evaluation_interval: 1m

tests:
  - name: the shop stops answering
    interval: 1m
    input_series:
      - series: 'up{job="openline", instance="127.0.0.1:9180"}'
        values: "1 1 0 0 0 0"
    alert_rule_test:
      - eval_time: 3m
        alertname: OpenlineDown
        exp_alerts: []
      - eval_time: 5m
        alertname: OpenlineDown
        exp_alerts:
          - exp_labels: {severity: critical, job: openline, instance: "127.0.0.1:9180"}
            exp_annotations:
              summary: "Магазин не отвечает"
              description: "Prometheus не может забрать /metrics уже 2 минуты: процесс упал или сервер недоступен."

  - name: server errors above two percent
    interval: 1m
    input_series:
      - series: 'openline_http_requests_total{route="GET /{$}", code="2xx"}'
        values: "0+600x15"
      - series: 'openline_http_requests_total{route="POST /order", code="5xx"}'
        values: "0+60x15"
    alert_rule_test:
      - eval_time: 12m
        alertname: OpenlineErrors
        exp_alerts:
          - exp_labels: {severity: warning}

  - name: a quiet shop raises nothing
    interval: 1m
    input_series:
      - series: 'openline_http_requests_total{route="GET /{$}", code="2xx"}'
        values: "0+10x15"
      - series: 'openline_antifraud_decisions_total{action="block"}'
        values: "0+1x15"
    alert_rule_test:
      - eval_time: 14m
        alertname: OpenlineErrors
        exp_alerts: []
      - eval_time: 14m
        alertname: OpenlineFraudWave
        exp_alerts: []

  - name: a wave of refused orders
    interval: 1m
    input_series:
      - series: 'openline_antifraud_decisions_total{action="block"}'
        values: "0+5x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: OpenlineFraudWave
        exp_alerts:
          - exp_labels: {severity: warning}
