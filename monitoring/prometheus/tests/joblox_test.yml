# promtool test rules monitoring/prometheus/tests/joblox_test.yml (from monitoring/prometheus)
rule_files:
  - ../rules/joblox.yml

evaluation_interval: 1m

tests:
  - name: the shop stops answering
    interval: 1m
    input_series:
      - series: 'up{job="joblox", instance="127.0.0.1:9180"}'
        values: "1 1 0 0 0 0"
    alert_rule_test:
      - eval_time: 3m
        alertname: JobloxDown
        exp_alerts: []
      - eval_time: 5m
        alertname: JobloxDown
        exp_alerts:
          - exp_labels: {severity: critical, job: joblox, instance: "127.0.0.1:9180"}
            exp_annotations:
              summary: "Магазин не отвечает"
              description: "Prometheus не может забрать /metrics уже 2 минуты: процесс упал или сервер недоступен."

  - name: server errors above two percent
    interval: 1m
    input_series:
      - series: 'joblox_http_requests_total{route="GET /{$}", code="2xx"}'
        values: "0+600x15"
      - series: 'joblox_http_requests_total{route="POST /order", code="5xx"}'
        values: "0+60x15"
    alert_rule_test:
      - eval_time: 12m
        alertname: JobloxErrors
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Больше 2% запросов с ошибкой сервера"
              description: "Доля ответов 5xx за 5 минут выше 2%. Смотрите журнал процесса."

  - name: a quiet shop raises nothing
    interval: 1m
    input_series:
      - series: 'joblox_http_requests_total{route="GET /{$}", code="2xx"}'
        values: "0+10x15"
      - series: 'joblox_antifraud_decisions_total{action="block"}'
        values: "0+1x15"
    alert_rule_test:
      - eval_time: 14m
        alertname: JobloxErrors
        exp_alerts: []
      - eval_time: 14m
        alertname: JobloxFraudWave
        exp_alerts: []

  - name: a wave of refused orders
    interval: 1m
    input_series:
      - series: 'joblox_antifraud_decisions_total{action="block"}'
        values: "0+5x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: JobloxFraudWave
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Волна отклонённых заказов"
              description: "Антифрод отклонил больше 30 попыток за 15 минут. Возможна атака: проверьте /orders в боте, при необходимости /pause."
