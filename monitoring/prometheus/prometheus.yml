# Prometheus for OpenLine Shop. The server's /metrics lives on the admin listener (127.0.0.1:9180),
# so Prometheus runs on the host network next to it (monitoring/docker-compose.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: openline
    static_configs:
      - targets: ["127.0.0.1:9180"]
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9102"]
