groups:
  - name: joblox
    rules:
      - alert: JobloxDown
        expr: up{job="joblox"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Магазин не отвечает"
          description: "Prometheus не может забрать /metrics уже 2 минуты: процесс упал или сервер недоступен."

      - alert: JobloxErrors
        expr: |
          sum(rate(joblox_http_requests_total{code="5xx"}[5m]))
            / clamp_min(sum(rate(joblox_http_requests_total[5m])), 0.001) > 0.02
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Больше 2% запросов с ошибкой сервера"
          description: "Доля ответов 5xx за 5 минут выше 2%. Смотрите журнал процесса."

      - alert: JobloxSlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(joblox_http_request_duration_seconds_bucket{route="GET /{$}"}[5m]))) > 0.5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Витрина отвечает медленно"
          description: "95-й процентиль времени ответа главной страницы выше 0,5 с уже 10 минут."

      - alert: JobloxFraudWave
        expr: sum(increase(joblox_antifraud_decisions_total{action="block"}[15m])) > 30
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "Волна отклонённых заказов"
          description: "Антифрод отклонил больше 30 попыток за 15 минут. Возможна атака: проверьте /orders в боте, при необходимости /pause."
